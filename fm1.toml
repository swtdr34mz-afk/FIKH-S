# FIKH-S build settings (fm1-base tools/build.py). The pixel type of the platform's own screens: X0X_FONTSET=terminus in
# the environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host).
# The panel's engraved serif faces are FIKH-S's own (ui_serif.h, from tools/gen_serif.py).
name = "fikhs"                    # the build's file names: fikhs-0.1.fwsc, build/host/fikhs_host
title = "FIKH-S"                  # the name people see (firmware hubs)
id_prefix = "FM-1_593"            # package identity: dev FM-1_59300, releases FM-1_593 + XXYYZZ (BA-55 592)
usb_manufacturer = "swtdr34mz"
usb_product = "FIKH-S FM-1"       # the USB name (the MIDI port in a DAW)
o2 = ["dsp/fikh_core.c"]          # the sound core, at -O2 (its parts are included: one translation unit)
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
tagline = "Experimental synthesis after the Forge TME VHIKK X: 9 algorithms for drones, basses and textures, a dungeon / reflekta delay with a frequency shifter in its feedback, an ambient reverb"
repo = "https://github.com/swtdr34mz-afk/FIKH-S"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments). Liberation Serif (SIL OFL 1.1)."
author = "swtdr34mz"
description = "An experimental drone, bass and texture synth after the Forge TME VHIKK X. Nine algorithms (metal pair, waveshaper, sine cluster, wavetable quad, diatonic, chord scanner, partials, comb swarm, grain cloud) through a FIELD filter into a metallic DUNGEON or diffuse REFLEKTA delay with a frequency shifter in its feedback, then an ambient reverb after the Walrus Audio SLOER (DREAM, DARK, RISE, LIGHT, RAIN, DECAY to INF). HOLD, DICE, FREEZE, per-oscillator drift. Unofficial: no code, sound or artwork of Forge TME or Walrus Audio."
tags = ["synth", "ambient"]
install = "https://github.com/swtdr34mz-afk/FIKH-S/releases"
screenshot = "site/img/screen-main.png"
